name: snow-chibi-tests-gambit

on: [workflow_dispatch, push, pull_request]

env:
    SCHEME: gambit

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install gambit
        run: |
          sudo apt install -y gambc
      - id: Tests
        uses: ./.github/actions/snow-chibi-tests
