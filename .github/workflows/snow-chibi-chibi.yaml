name: snow-chibi-tests-chibi

on: [workflow_dispatch, push, pull_request]

jobs:
  snow-chibi-tests-chibi:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v6
      - id: Tests
        env:
          SCHEME: chibi
          HOST: snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
