name: snow-chibi-tests-chibi

on: [workflow_dispatch, push, pull_request]

env:
    SCHEME: chibi
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    REPO_OWNER: ${{ github.repository_owner }}

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: Retropikzel/chibi-scheme/snow-chibi-tests@snow-chibi-github-actions-tests
