name: snow-chibi-tests-chibi

on: [workflow_dispatch, push, pull_request]

env:
    SCHEME: chibi
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: ${{ github.repository_owner }}/chibi-scheme/snow-chibi-tests@${{ env.BRANCH_NAME }}
