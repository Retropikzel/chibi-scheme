name: snow-chibi-tests-chicken

on: [workflow_dispatch, push, pull_request]

env:
    SCHEME: chicken

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v6
      - name: Install chicken
        run: |
          sudo apt install -y chicken-bin
          chicken-install r7rs
      - id: Tests
        uses: ./.github/actions/snow-chibi-tests
