name: snow-chibi-tests-chicken

on: [workflow_dispatch]

env:
    SCHEME: chicken
    APT_PACKAGES: chicken-bin

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install $SCHEME
        run: sudo apt install -y $APT_PACKAGES
      - uses: Retropikzel/chibi-scheme/snow-chibi-tests@snow-chibi-github-actions-tests
