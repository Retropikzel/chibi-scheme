name: snow-chibi-tests-chicken

on: [workflow_dispatch]

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install chicken
        run: sudo apt install -y chicken-bin
      - id: Tests
        uses: ./.github/actions/snow-chibi-tests
        with:
          scheme: "chicken"
