name: snow-chibi-tests-chibi

on: [workflow_dispatch, push, pull_request]

jobs:
  chibi:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - id: snow-fort
        env:
          SCHEME: chibi
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - id: git
        env:
          SCHEME: chibi
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  chicken:
    runs-on: ubuntu-26.04
    steps:
      - name: Install chicken
        shell: bash
        run: |
          sudo apt-get install -y chicken-bin
          sudo chicken-install r7rs
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: chicken
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: chicken
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  kawa:
    runs-on: ubuntu-26.04
    steps:
      - name: Install kawa
        shell: bash
        run: |
          git clone https://gitlab.com/kashell/Kawa.git
          cd Kawa
          bash autogen.sh
          ./configure --prefix=/usr/local
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: kawa
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: kawa
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  loko:
    runs-on: ubuntu-26.04
    steps:
      - name: Install loko
        shell: bash
        run: |
          wget https://scheme.fail/releases/loko-0.13.0.tar.gz
          tar -xf loko-0.13.0.tar.gz
          cd loko-0.13.0
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: loko
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: loko
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  mosh:
    runs-on: ubuntu-26.04
    steps:
      - name: Install mosh
        shell: bash
        run: |
          sudo apt-get install -y libonig-dev
          wget https://github.com/higepon/mosh/releases/download/mosh-0.2.9-rc1/mosh-0.2.9-rc1.tar.gz
          tar -xf mosh-0.2.9-rc1.tar.gz
          cd mosh-0.2.9-rc1
          ./configure --prefix=/usr/local
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: mosh
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: mosh
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  racket:
    runs-on: ubuntu-26.04
    steps:
      - name: Install racket
        shell: bash
        run: |
          sudo apt-get install -y racket
          raco pkg install --auto r7rs
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: racket
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: racket
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  tr7:
    runs-on: ubuntu-26.04
    steps:
      - name: Install skint
        shell: bash
        run: |
          git clone https://gitlab.com/jobol/tr7.git --branch=v2.0.19
          cd tr7
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: tr7
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: tr7
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
