name: snow-chibi-tests-chibi

on: [workflow_dispatch, push, pull_request]

jobs:
  chibi:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v6
      - id: snow-fort
        env:
          SCHEME: chibi
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - id: git
        env:
          SCHEME: chibi
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  chicken:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install chicken
        shell: bash
        run: |
          sudo apt-get install -y chicken-bin
          sudo chicken-install r7rs
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: chicken
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: chicken
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  gambit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install gambit
        shell: bash
        run: |
          sudo apt-get install -y gambc
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: gambit
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: gambit
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  gauche:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install gauche
        shell: bash
        run: |
          sudo apt-get install -y gauche
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: gauche
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: gauche
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  guile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install guile
        shell: bash
        run: |
          sudo apt-get install -y guile-3.0
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: guile
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: gauche
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  kawa:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install kawa
        shell: bash
        run: |
          git clone https://gitlab.com/kashell/Kawa.git
          cd Kawa
          ./configure --prefix=/usr/local
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: kawa
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: kawa
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  racket:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install racket
        shell: bash
        run: |
          sudo apt-get install -y racket
          raco pkg install --auto r7rs
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: racket
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: racket
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
