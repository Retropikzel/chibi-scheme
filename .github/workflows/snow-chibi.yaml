name: snow-chibi

on:
  workflow_dispatch:
  push:
    branches:
      - snow-chibi*
  pull_request:
    branches:
      - master
      - snow-chibi*

jobs:
  capyscheme:
    runs-on: ubuntu-26.04
    if: ${{ startsWith(github.head_ref, 'snow-chibi') || startsWith(github.ref_name, 'snow-chibi') }}
    steps:
      - name: Install capyscheme
        shell: bash
        run: |
          VERSION=3.1.0
          wget https://github.com/playX18/capyscheme/releases/download/v${VERSION}/capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar -xf capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          cp -r capy/${VERSION} /opt/capy
          ln -sf /opt/capy/capy /usr/local/bin/capy
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: capyscheme
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: capyscheme
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
      - name: Capy prefix test
        shell: bash
        run: |
          set -eux
          rm -rf /tmp/prefix
          rm -rf prefix.scm
          snow-chibi install --always-yes --impls=capyscheme --install-prefix=/tmp/prefix --always-yes "(retropikzel hello)"
          printf "(import (scheme base) (retropikzel hello)) (hello)" > prefix.scm
          tree /tmp/prefix
          capy -A /tmp/prefix/share/snow/capyscheme prefix.scm | tee /tmp/prefix/out.txt
          if cat /tmp/prefix/out.txt | grep -q "Hello"; then
            sleep 0
          else
            exit 1
          fi
  chibi:
    runs-on: ubuntu-26.04
    if: ${{ startsWith(github.head_ref, 'snow-chibi') || startsWith(github.ref_name, 'snow-chibi') }}
    steps:
      - uses: actions/checkout@v6
      - id: snow-fort
        env:
          SCHEME: chibi
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - id: git
        env:
          SCHEME: chibi
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
      - name: Chibi prefix test
        shell: bash
        run: |
          set -eux
          rm -rf /tmp/prefix
          snow-chibi install --always-yes --impls=chibi --install-prefix=/tmp/prefix --always-yes "(retropikzel hello)"
          printf "(import (scheme base) (retropikzel hello)) (hello)" > /tmp/prefix.scm
          tree /tmp/prefix
          chibi-scheme -A /tmp/prefix/share/snow/chibi /tmp/prefix.scm | tee /tmp/prefix/out.txt
          if cat /tmp/prefix/out.txt | grep -q "Hello"; then
            sleep 0
          else
            exit 1
          fi
  chicken-from-apt:
    runs-on: ubuntu-26.04
    if: ${{ startsWith(github.head_ref, 'snow-chibi') || startsWith(github.ref_name, 'snow-chibi') }}
    steps:
      - name: Install chicken
        shell: bash
        run: |
          sudo apt-get install -y chicken-bin
          sudo chicken-install r7rs
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: chicken
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: chicken
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
  cyclone:
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.head_ref, 'snow-chibi') || startsWith(github.ref_name, 'snow-chibi') }}
    steps:
      - name: Install cyclone
        shell: bash
        run: |
          sudo apt-get install -y libtommath-dev libck-dev
          wget -O cyclone-bootstrap.tar.gz https://github.com/justinethier/cyclone-bootstrap/archive/refs/tags/v0.36.0.tar.gz
          mkdir cyclone && tar -C cyclone --strip-components 1 -xf cyclone-bootstrap.tar.gz
          cd cyclone
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: snow-fort
        env:
          SCHEME: cyclone
          HOST: http://snow-fort.org
        uses: ./.github/actions/snow-chibi-tests
      - name: git
        env:
          SCHEME: cyclone
          HOST: https://github.com/Snow-fort-repository/snow-fort-repository.git
        uses: ./.github/actions/snow-chibi-tests
      - name: Cyclone prefix test
        shell: bash
        run: |
          set -eux
          rm -rf /tmp/prefix
          rm -rf prefix.scm
          snow-chibi install --always-yes --impls=cyclone --install-prefix=/tmp/prefix --always-yes "(retropikzel hello)"
          printf "(import (scheme base) (retropikzel hello)) (hello)" > prefix.scm
          tree /tmp/prefix
          cyclone -A /tmp/prefix/share/snow/cyclone prefix.scm
          ./prefix | tee /tmp/prefix/out.txt
          if cat /tmp/prefix/out.txt | grep -q "Hello"; then
            sleep 0
          else
            exit 1
          fi
