name: snow-chibi-tests-gauche

on: [workflow_dispatch, push, pull_request]

env:
    SCHEME: gauche

jobs:
  snow-chibi-tests-gauche:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Install gauche
        run: |
          sudo apt install -y gauche
      - id: Tests
        uses: ./.github/actions/snow-chibi-tests
