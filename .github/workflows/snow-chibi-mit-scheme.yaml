name: snow-chibi-tests-mit-scheme

on: [workflow_dispatch, push, pull_request]

env:
    SCHEME: mit-scheme

jobs:
  snow-chibi-tests-chicken:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v6
      - name: Install mit-scheme
        run: |
          sudo apt install -y mit-scheme
      - id: Tests
        uses: ./.github/actions/snow-chibi-tests
